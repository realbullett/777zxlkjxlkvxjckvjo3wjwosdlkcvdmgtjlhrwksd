<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sire.lol — leaderboard (redesign test)</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; color: #fff; font-family: "Plus Jakarta Sans", Inter, -apple-system, sans-serif; min-height: 100vh; }
  .bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bgfx .orb { position: absolute; border-radius: 9999px; filter: blur(90px); opacity: 0.35; animation: drift 14s ease-in-out infinite alternate; }
  .bgfx .o1 { width: 420px; height: 420px; left: -140px; top: -120px; background: radial-gradient(circle, rgba(59,130,246,0.55), transparent 70%); }
  .bgfx .o2 { width: 360px; height: 360px; right: -120px; top: 30%; background: radial-gradient(circle, rgba(250,204,21,0.28), transparent 70%); animation-delay: -5s; }
  .bgfx .o3 { width: 480px; height: 480px; left: 20%; bottom: -220px; background: radial-gradient(circle, rgba(168,85,247,0.3), transparent 70%); animation-delay: -9s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(60px, 40px) scale(1.12); } }
  .bgfx .star { position: absolute; border-radius: 9999px; background: #fff; opacity: 0.15; animation: twk 3s ease-in-out infinite; }
  @keyframes twk { 0%, 100% { opacity: 0.08; transform: scale(0.8); } 50% { opacity: 0.5; transform: scale(1.2); } }
  .wrap { max-width: 672px; margin: 0 auto; padding: 64px 16px 40px; position: relative; z-index: 1; }
  .title { text-align: center; font-size: 40px; font-weight: 900; letter-spacing: -0.02em; margin-bottom: 20px; }
  .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: rgba(255,255,255,0.3); text-decoration: none; margin-bottom: 32px; }
  .back:hover { color: rgba(255,255,255,0.6); }
  .hero {
    position: relative; overflow: hidden; border-radius: 24px; margin-bottom: 32px;
    border: 1px solid rgba(96,165,250,0.3);
    background: linear-gradient(120deg, #1d4ed8 0%, #3b82f6 55%, #bfdbfe 100%);
    box-shadow: 0 0 48px rgba(59,130,246,0.35);
    padding: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.35), transparent 60%); pointer-events: none; }
  .hero-title { display: flex; align-items: center; gap: 8px; font-size: 30px; font-weight: 900; letter-spacing: -0.02em; color: #fff; margin-bottom: 8px; }
  .hero-sub { font-size: 14px; color: rgba(255,255,255,0.85); }
  .hero-total { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .hero-total b { font-size: 24px; font-weight: 900; color: #fff; font-variant-numeric: tabular-nums; }
  .hero-total span { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.75); }
  .selects-row { display: flex; justify-content: flex-start; margin-bottom: 32px; }
  .selects { display: flex; gap: 10px; }
  .sel { position: relative; }
  .sel button {
    display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600;
    background: #161616; border: 1px solid #262626; color: #fff;
    padding: 8px 16px; border-radius: 12px; cursor: pointer;
  }
  .sel button svg { opacity: 0.5; }
  .sel button .lbl { display: inline-flex; align-items: center; gap: 8px; }
  .sel button .lbl svg { opacity: 0.6; }
  .sel .menu {
    position: absolute; left: 0; top: calc(100% + 6px); z-index: 20;
    background: rgba(22,22,22,0.97); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    min-width: 140px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    opacity: 0; transform: translateY(-6px) scale(0.98); transform-origin: top left;
    pointer-events: none; transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .sel.open .menu { opacity: 1; transform: none; pointer-events: auto; }
  .sel .menu button { width: 100%; border: 0; border-radius: 10px; justify-content: flex-start; color: rgba(255,255,255,0.6); font-size: 12px; padding: 10px 12px; }
  .sel .menu button:hover { background: rgba(255,255,255,0.06); }
  .sel .menu button.on { color: #facc15; background: rgba(250,204,21,0.08); }
  .sel .chev { transition: transform 0.18s ease; }
  .sel.open .chev { transform: rotate(180deg); }
  .stage {
    border: 1px solid #1f1f1f; border-radius: 20px; overflow: hidden;
    background: radial-gradient(ellipse 55% 38% at 50% 0%, rgba(250,204,21,0.14), transparent 70%), #0d0d0d;
    padding: 24px 12px 0; margin-bottom: 24px;
  }
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 0; }
  .pod { display: flex; flex-direction: column; align-items: center; width: 140px; opacity: 0; animation: podIn 0.7s ease forwards; }
  .pod.p1 { animation-delay: 0.15s; }
  .pod.p2 { animation-delay: 1.05s; }
  .pod.p3 { animation-delay: 1.95s; }
  @keyframes podIn { from { opacity: 0; transform: translateY(90px); } to { opacity: 1; transform: none; } }
  .crown-float { height: 42px; display: flex; align-items: flex-end; margin-bottom: -4px; z-index: 2; }
  .av { border-radius: 9999px; overflow: hidden; background: #1c1c1c; position: relative; z-index: 1; }
  .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .av .init { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 900; color: rgba(255,255,255,0.25); }
  .p1 .av { width: 92px; height: 92px; font-size: 28px; border: 2px solid #facc15; box-shadow: 0 0 24px rgba(250,204,21,0.9), 0 0 64px rgba(250,204,21,0.55), 0 0 120px rgba(250,204,21,0.3); }
  .p1 .crown-float svg { filter: drop-shadow(0 0 10px rgba(250,204,21,0.9)) drop-shadow(0 0 26px rgba(250,204,21,0.5)); }
  .p1 .ped { box-shadow: 0 -8px 48px rgba(250,204,21,0.35); }
  .p2 .av { width: 80px; height: 80px; font-size: 24px; border: 2px solid #d1d5db; }
  .p3 .av { width: 80px; height: 80px; font-size: 24px; border: 2px solid #b45309; }
  .uname { margin-top: 8px; font-size: 16px; font-weight: 700; color: #fff; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uname .bdg { width: 18px; height: 18px; object-fit: contain; display: inline-block; vertical-align: -2px; margin-left: 3px; }
  .badge { display: inline-block; }
  .badge img { display: block; }
  #btip { position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, 4px); background: #000; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 11px; white-space: nowrap; opacity: 0; transition: opacity .15s ease, transform .15s ease; box-shadow: 0 8px 24px rgba(0,0,0,.6); text-align: left; }
  #btip.show { opacity: 1; transform: translate(-50%, 0); }
  #btip b { display: block; font-size: 12px; font-weight: 700; color: #fff; }
  #btip span { display: block; font-size: 11px; color: rgba(255,255,255,.55); margin-top: 2px; }
  .plink { color: inherit; text-decoration: none; }
  .plink:hover { text-decoration: underline; }
  .vpill {
    margin-top: 6px; margin-bottom: 12px; display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 9999px;
  }
  .p1 .vpill { color: #fcd34d; background: rgba(250,204,21,0.08); border: 1px solid rgba(250,204,21,0.35); }
  .p2 .vpill { color: #e4e4e7; background: rgba(228,228,231,0.08); border: 1px solid rgba(228,228,231,0.35); }
  .p3 .vpill { color: #fdba74; background: rgba(180,83,9,0.12); border: 1px solid rgba(180,83,9,0.45); }
  .ped { width: 100%; border-radius: 16px 16px 0 0; display: flex; align-items: flex-start; justify-content: center; font-weight: 900; }
  .p2 .ped { height: 112px; padding-top: 8px; font-size: 26px; background: linear-gradient(to bottom, #52525b, #27272a); color: #f4f4f5; border: 1px solid #3f3f46; border-bottom: 0; }
  .p1 .ped { height: 152px; padding-top: 8px; font-size: 26px; background: linear-gradient(to bottom, #facc15, #a16207); color: #422006; border: 1px solid rgba(250,204,21,0.5); border-bottom: 0; }
  .p3 .ped { height: 92px; padding-top: 8px; font-size: 26px; background: linear-gradient(to bottom, #b45309, #451a03); color: #fdba74; border: 1px solid rgba(180,83,9,0.5); border-bottom: 0; }
  .panel { border: 1px solid #1f1f1f; border-radius: 24px; overflow: hidden; background: #0d0d0d; padding: 16px; }
  .thead, .row { display: flex; align-items: center; gap: 12px; padding: 12px; }
  .thead { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.35); border-bottom: 1px solid #1f1f1f; }
  .thead .c-rank, .row .c-rank { width: 56px; flex-shrink: 0; }
  .thead .c-user, .row .c-user { flex: 1; }
  .thead .c-score, .row .c-score { width: 90px; text-align: right; flex-shrink: 0; }
  .row { border-bottom: 1px solid #161616; font-size: 14px; border-radius: 16px; }
  .row:last-child { border-bottom: 0; }
  .row .c-rank { font-weight: 700; color: rgba(255,255,255,0.4); }
  .who { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .rav { width: 36px; height: 36px; border-radius: 9999px; background: #1c1c1c; overflow: hidden; flex-shrink: 0; border: 1px solid #2a2a2a; }
  .rav img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .rav .init { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.3); }
  .rname { font-weight: 600; color: rgba(255,255,255,0.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rname .bdg { width: 14px; height: 14px; object-fit: contain; display: inline-block; vertical-align: -2px; margin-left: 3px; }
  .rmeta { display: flex; flex-direction: column; min-width: 0; }
  .rhandle { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 1px; }
  .row .c-score { font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
  .note { text-align: center; font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 24px; }
</style>
</head>
<body>
<div class="bgfx"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div id="stars"></div></div>
<div class="wrap">
  <a class="back" href="#" onclick="return false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>back</a>
  <div class="hero">
    <div style="position:relative;z-index:1">
      <div class="hero-title"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fde047" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>leaderboard</div>
      <p class="hero-sub">the most viewed profiles, ranked.</p>
    </div>
    <div class="hero-total"><b id="heroTotal">0</b><span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>total views</span></div>
  </div>
  <div class="selects-row">
  <div class="selects">
      <div class="sel" id="selMetric">
        <button onclick="toggleMenu('selMetric')"><span class="lbl"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>Views</span> <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu"><button class="on">Views</button></div>
      </div>
      <div class="sel" id="selPeriod">
        <button onclick="toggleMenu('selPeriod')"><span class="lbl"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg><span id="periodLabel">All time</span></span> <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="menu">
          <button id="optAll" class="on" onclick="setPeriod('all')">All time</button>
          <button id="optMonth" onclick="setPeriod('month')">This month</button>
        </div>
      </div>
    </div>
  </div>
  <div class="stage"><div class="podium" id="podium"></div></div>
  <div class="panel" id="table"></div>
  <p class="note">redesign test (mock data) — public/test-leaderboard.html</p>
</div>
<script>
  var DATA = {
    all: [
      { username: "iqqm", views: 485, av: "https://i.pravatar.cc/100?img=12", badges: ["premium.webp", "og.png", "verified.png"] },
      { username: "woke", views: 361, av: "https://i.pravatar.cc/100?img=32", badges: ["staff.webp", "verified.png", "booster.webp"] },
      { username: "cus", views: 125, av: null, badges: ["verified.png", "premium.webp", "staff.webp"] },
      { username: "cozmin", views: 116, av: "https://i.pravatar.cc/100?img=5", badges: ["og.png", "staff.webp", "verified.png", "premium.webp", "owner.webp", "booster.webp"] },
      { username: "pythqn", views: 81, av: "https://i.pravatar.cc/100?img=15", badges: ["staff.webp", "verified.png", "premium.webp", "og.png", "owner.webp"] },
      { username: "moj", views: 64, av: "https://i.pravatar.cc/100?img=8", badges: ["verified.png"] },
      { username: "vhs", views: 52, av: null, badges: [] },
      { username: "sire", views: 47, av: "https://i.pravatar.cc/100?img=25", badges: ["owner.webp"] }
    ],
    month: [
      { username: "woke", views: 210, av: "https://i.pravatar.cc/100?img=32", badges: ["staff.webp", "verified.png"] },
      { username: "iqqm", views: 188, av: "https://i.pravatar.cc/100?img=12", badges: ["premium.webp"] },
      { username: "pythqn", views: 44, av: "https://i.pravatar.cc/100?img=15", badges: ["staff.webp", "verified.png", "premium.webp", "og.png", "owner.webp"] },
      { username: "cozmin", views: 31, av: "https://i.pravatar.cc/100?img=5", badges: ["og.png", "staff.webp", "verified.png", "premium.webp", "owner.webp", "booster.webp"] },
      { username: "moj", views: 19, av: "https://i.pravatar.cc/100?img=8", badges: ["verified.png"] }
    ]
  };
  var CROWNS = {
    gold: '<svg width="36" height="36" viewBox="0 0 24 24" fill="#facc15"><path d="M11.56 3.26a.5.5 0 0 1 .88 0l2.95 5.67a1 1 0 0 0 1.52.28l5.1-5.1a.5.5 0 0 1 .87.47l-3.9 13.3a1 1 0 0 1-.96.72H6a1 1 0 0 1-.96-.72L1.13 4.58a.5.5 0 0 1 .87-.47l5.1 5.1a1 1 0 0 0 1.52-.28z"/></svg>',
    silver: '<svg width="30" height="30" viewBox="0 0 24 24" fill="#d1d5db"><path d="M11.56 3.26a.5.5 0 0 1 .88 0l2.95 5.67a1 1 0 0 0 1.52.28l5.1-5.1a.5.5 0 0 1 .87.47l-3.9 13.3a1 1 0 0 1-.96.72H6a1 1 0 0 1-.96-.72L1.13 4.58a.5.5 0 0 1 .87-.47l5.1 5.1a1 1 0 0 0 1.52-.28z"/></svg>',
    bronze: '<svg width="30" height="30" viewBox="0 0 24 24" fill="#b45309"><path d="M11.56 3.26a.5.5 0 0 1 .88 0l2.95 5.67a1 1 0 0 0 1.52.28l5.1-5.1a.5.5 0 0 1 .87.47l-3.9 13.3a1 1 0 0 1-.96.72H6a1 1 0 0 1-.96-.72L1.13 4.58a.5.5 0 0 1 .87-.47l5.1 5.1a1 1 0 0 0 1.52-.28z"/></svg>'
  };
  var EYE = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  var BADGE_INFO = {
    og: ["OG", "secured this badge in the early days of sire.lol"],
    premium: ["Premium", "exclusive badge for premium supporters"],
    verified: ["Verified", "officially verified account on sire.lol"],
    booster: ["Booster", "thank you for boosting the discord server"],
    staff: ["Staff", "member of the sire.lol staff team"],
    bug: ["bug hunter", "reported bugs that made sire.lol better"],
    corrupt: ["Corrupt", "corrupted... don't ask questions"],
    owner: ["Owner", "the owner of sire.lol"]
  };
  function badgesHTML(e, limit) {
    var list = e.badges || [];
    if (limit) list = list.slice(0, limit);
    return list.map(function(b) {
      var id = String(b).split(".")[0];
      var info = BADGE_INFO[id] || [id, "exclusive sire.lol badge"];
      return '<span class="badge" data-n="' + esc(info[0]) + '" data-d="' + esc(info[1]) + '"><img class="bdg" src="emojis/' + b + '" alt="" /></span>';
    }).join("");
  }
  function avHTML(e) {
    if (e.av) return '<img src="' + e.av + '" alt="" />';
    return '<div class="init">' + esc(e.username.charAt(0).toUpperCase()) + '</div>';
  }
  function toggleMenu(id) {
    var el = document.getElementById(id);
    var was = el.className.indexOf("open") !== -1;
    document.getElementById("selMetric").className = "sel";
    document.getElementById("selPeriod").className = "sel";
    el.className = was ? "sel" : "sel open";
  }
  document.addEventListener("click", function(e) {
    if (!e.target.closest || !e.target.closest(".sel")) {
      document.getElementById("selMetric").className = "sel";
      document.getElementById("selPeriod").className = "sel";
    }
  });
  var tip = document.getElementById("btip");
  function showTip(b) {
    var r = b.getBoundingClientRect();
    tip.innerHTML = "<b>" + b.getAttribute("data-n") + "</b><span>" + b.getAttribute("data-d") + "</span>";
    tip.classList.add("show");
    var h = tip.offsetHeight || 52;
    var x = Math.max(110, Math.min(window.innerWidth - 110, r.left + r.width / 2));
    var above = r.top - h - 12 > 8;
    tip.style.left = x + "px";
    tip.style.top = (above ? r.top - h - 10 : r.bottom + 10) + "px";
  }
  function hideTip() { tip.classList.remove("show"); }
  document.addEventListener("mouseover", function(e) {
    var b = e.target && e.target.closest ? e.target.closest(".badge") : null;
    if (b) showTip(b);
  });
  document.addEventListener("mouseout", function(e) {
    var b = e.target && e.target.closest ? e.target.closest(".badge") : null;
    if (b && (!e.relatedTarget || !b.contains(e.relatedTarget))) hideTip();
  });
  document.addEventListener("scroll", hideTip, true);
  function compact(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(n);
  }
  function setPeriod(p) {
    document.getElementById("periodLabel").textContent = p === "all" ? "All time" : "This month";
    document.getElementById("optAll").className = p === "all" ? "on" : "";
    document.getElementById("optMonth").className = p === "month" ? "on" : "";
    document.getElementById("selPeriod").className = "sel";
    var rows = DATA[p].slice().sort(function(a, b) { return b.views - a.views; });
    var total = rows.reduce(function(a, b) { return a + b.views; }, 0);
    var order = [
      { e: rows[1], cls: "p2", crown: CROWNS.silver, rank: 2 },
      { e: rows[0], cls: "p1", crown: CROWNS.gold, rank: 1 },
      { e: rows[2], cls: "p3", crown: CROWNS.bronze, rank: 3 }
    ];
    var ph = "";
    order.forEach(function(s) {
      if (!s.e) return;
      ph += '<div class="pod ' + s.cls + '">'
        + '<div class="crown-float">' + s.crown + '</div>'
        + '<div class="av">' + avHTML(s.e) + '</div>'
        + '<div class="uname"><a class="plink" href="/' + encodeURIComponent(s.e.username) + '">' + esc(s.e.username) + '</a>' + badgesHTML(s.e, 2) + '</div>'
        + '<span class="vpill">' + EYE + ' <span class="vnum" data-v="' + s.e.views + '">0</span></span>'
        + '<div class="ped">' + s.rank + '</div></div>';
    });
    document.getElementById("podium").innerHTML = ph;
    var th = '<div class="thead"><span class="c-rank">Rank</span><span class="c-user">User</span><span class="c-score">Score</span></div>';
    rows.slice(3).forEach(function(e, i) {
      th += '<div class="row"><span class="c-rank">#' + (i + 4) + '</span>'
        + '<span class="c-user"><span class="who"><span class="rav">' + avHTML(e) + '</span>'
        + '<span class="rmeta"><span class="rname"><a class="plink" href="/' + encodeURIComponent(e.username) + '">' + esc(e.username) + '</a>' + badgesHTML(e) + '</span><span class="rhandle">@' + esc(e.username) + '</span></span></span></span>'
        + '<span class="c-score" data-v="' + e.views + '">0</span></div>';
    });
    document.getElementById("table").innerHTML = th;
    animateNums(total);
  }
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function countUp(el, target, fmt, delay, dur) {
    if (REDUCED) { el.textContent = fmt(target); return; }
    if (delay > 0) { setTimeout(function() { countUp(el, target, fmt, 0, dur); }, delay); return; }
    var t0 = null; dur = dur || 1100;
    function step(t) {
      if (!t0) t0 = t;
      var k = Math.min(1, (t - t0) / dur), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
      el.textContent = fmt(Math.round(target * e));
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function animateNums(total) {
    countUp(document.getElementById("heroTotal"), total, compact);
    document.querySelectorAll("#podium .vnum").forEach(function(el) {
      var pod = el.closest(".pod"), dur = 1400, delay = 350;
      if (pod && pod.classList.contains("p2")) { dur = 1400; delay = 1200; }
      if (pod && pod.classList.contains("p3")) { dur = 1400; delay = 2100; }
      countUp(el, Number(el.getAttribute("data-v")), function(n) { return String(n); }, delay, dur);
    });
    document.querySelectorAll("#table .c-score").forEach(function(el) {
      countUp(el, Number(el.getAttribute("data-v")), function(n) { return n.toLocaleString(); });
    });
  }
  (function stars() {
    var box = document.getElementById("stars"), h = "";
    for (var i = 0; i < 28; i++) {
      var x = (i * 37 + 11) % 100, y = (i * 53 + 7) % 100, s = 1 + (i % 3);
      h += '<span class="star" style="left:' + x + '%;top:' + y + '%;width:' + s + 'px;height:' + s + 'px;animation-delay:' + (i * 0.23).toFixed(2) + 's"></span>';
    }
    box.innerHTML = h;
  })();
  setPeriod("all");
</script>
<div id="btip"></div>
</body>
