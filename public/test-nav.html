<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>sire.lol — nav test</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #080808; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; }
.layout { display: flex; width: 100%; min-height: 100vh; }

/* ===== exact-ish sire sidebar ===== */
.sidebar {
  width: 192px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.04);
  display: flex; flex-direction: column; padding-top: 8px;
  position: sticky; top: 0; height: 100vh;
}
.logo { font-size: 20px; font-weight: 800; letter-spacing: -0.04em; color: #fff; background: none; border: none; padding: 0 24px; margin-bottom: 16px; text-align: left; cursor: pointer; font-family: inherit; }
.logo .dot { color: #3b82f6; }
.searchwrap { padding: 0 12px; margin-bottom: 16px; }
.searchwrap input {
  width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px; padding: 7px 12px; font-size: 12px; color: rgba(255,255,255,0.6);
  outline: none; font-family: inherit; transition: border-color .2s;
}
.searchwrap input::placeholder { color: rgba(255,255,255,0.2); }
.searchwrap input:focus { border-color: rgba(59,130,246,0.4); }

.navlist { display: flex; flex-direction: column; gap: 2px; padding: 0 12px; overflow-y: auto; flex: 1; }
.navlist::-webkit-scrollbar { width: 4px; }
.navlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

.tab { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; border: 1px solid transparent; background: none; color: rgba(255,255,255,0.3); font-family: inherit; text-align: left; width: 100%; flex-shrink: 0; }
.tab:hover { color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.03); }
.tab.active { background: rgba(59,130,246,0.2); color: #93c5fd; }
.tab svg { flex-shrink: 0; }
.tab .chev { margin-left: auto; transition: transform .25s; opacity: .5; }
.tab.open .chev { transform: rotate(90deg); }
.tab.widgets { color: #6ee7b7; border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.15); box-shadow: 0 0 25px rgba(16,185,129,0.35); animation: sh 2.5s linear infinite; background-size: 200% 200%; }
.tab.premium { color: #93c5fd; border-color: rgba(59,130,246,0.3); background: rgba(59,130,246,0.15); box-shadow: 0 0 25px rgba(37,99,235,0.35); animation: sh 2.5s linear infinite; background-size: 200% 200%; }
@keyframes sh { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.tab .crown { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); animation: pulse 2s infinite; color: #93c5fd; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

/* sub menu */
.sub { overflow: hidden; max-height: 0; margin-left: 14px; border-left: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; opacity: 0; transition: max-height .3s cubic-bezier(.4,0,.2,1), opacity .25s ease; }
.sub.open { max-height: 500px; opacity: 1; }
.sublist { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 6px 8px; }
.subitem {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px;
  font-size: 12px; color: rgba(255,255,255,0.35); cursor: pointer; transition: all .15s;
  background: none; border: none; font-family: inherit; text-align: left; width: 100%;
}
.subitem:hover { color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.04); }
.subitem.on { color: #93c5fd; background: rgba(59,130,246,0.15); }
.subitem .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; }

.usercard { margin-top: auto; padding: 0 12px 24px; }
.userrow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,0.03); }
.avatar { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.06); overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.3); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.uname { flex: 1; min-width: 0; }
.uname p:first-child { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.uname p:last-child { font-size: 10px; color: rgba(255,255,255,0.3); text-transform: capitalize; }
.logout { background: none; border: none; color: rgba(255,255,255,0.3); cursor: pointer; padding: 4px; }
.logout:hover { color: #f87171; }

/* content */
.content { flex: 1; padding: 40px; }
.content h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; }
.content .crumb { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 24px; }
.content .crumb b { color: #93c5fd; font-weight: 600; }
.card { background: rgba(22,22,22,0.6); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; max-width: 620px; }
.card p { font-size: 13px; color: rgba(255,255,255,0.45); line-height: 1.6; }
.hint { margin-top: 14px; font-size: 12px; color: rgba(255,255,255,0.25); }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <button class="logo">sire<span class="dot">.</span>lol</button>
    <div class="searchwrap"><input type="text" placeholder="search..." /></div>
    <div class="navlist" id="nav"></div>
    <div class="usercard">
      <div class="userrow">
        <div class="avatar"><img src="emojis/verified.png" alt="" onerror="this.style.display='none'" /></div>
        <div class="uname"><p>moj</p><p>discord</p></div>
        <button class="logout" title="log out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="content">
    <h1 id="ctitle">account overview</h1>
    <p class="crumb" id="crumb">dashboard / <b>account overview</b></p>
    <div class="card">
      <p id="cdesc">Pick something from the sidebar — every section now sits under its parent button, so you can jump straight to it.</p>
      <p class="hint">test file only · real sire source untouched until you confirm</p>
    </div>
  </main>
</div>

<script>
const ic = {
  user: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  paint: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>',
  eye: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>',
  link: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
  layout: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
  db: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>',
  award: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
  crown: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h20"/><path d="M4 18l-1-9 5 4 4-7 4 7 5-4-1 9"/></svg>',
  image: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  file: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
  widget: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
  trophy: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M17 5h3a2 2 0 0 1 0 4h-3M7 5H4a2 2 0 0 0 0 4h3"/></svg>',
  shield: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  chev: '<svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
};

const TABS = [
  { id: 'overview', label: 'account overview', icon: 'user', subs: ['profile info', 'security', 'danger zone'] },
  { id: 'customize', label: 'customize', icon: 'paint', subs: ['colors', 'fonts', 'element positions', 'name effects', 'entry overlay', 'background effects', 'banner & audio', 'other'] },
  { id: 'visibility', label: 'visibility', icon: 'eye', subs: ['seo', 'discord buttons', 'counters'] },
  { id: 'links', label: 'links', icon: 'link', subs: ['my links', 'platforms'] },
  { id: 'templates', label: 'templates', icon: 'layout', subs: ['my template', 'gallery', 'favorites'] },
  { id: 'data', label: 'data', icon: 'db', subs: ['analytics', 'resets'] },
  { id: 'badges', label: 'badges', icon: 'award', subs: ['my badges', 'name / row'] },
  { id: 'premium', label: 'premium', icon: 'crown', cls: 'premium', subs: ['upgrade', 'what you get'] },
  { id: 'imagehost', label: 'media host', icon: 'image', cls: 'premium', subs: ['uploaded media', 'limits'] },
  { id: 'filehost', label: 'file host', icon: 'file', cls: 'premium', subs: ['uploaded files', 'limits'] },
  { id: 'widgets', label: 'widgets', icon: 'widget', cls: 'widgets', subs: ['pages', 'about', 'song', 'projects', 'pinned widgets'] },
  { id: 'leaderboard', label: 'leaderboard', icon: 'trophy', external: true },
  { id: 'admin', label: 'admin', icon: 'shield', subs: ['users', 'admin log'] },
];

let open = 'customize';
let active = { tab: 'customize', sub: 'colors' };

const nav = document.getElementById('nav');
function render() {
  nav.innerHTML = '';
  TABS.forEach(t => {
    const isOpen = open === t.id && t.subs;
    const btn = document.createElement('button');
    btn.className = 'tab ' + (t.cls || '') + (isOpen ? ' open' : '') + (active.tab === t.id ? ' active' : '');
    btn.innerHTML = ic[t.icon] + '<span>' + t.label + '</span>' + (t.subs ? ic.chev : '');
    btn.onclick = () => {
      if (t.external) { /* would navigate to /leaderboard */ setCrumb(t.label, ''); return; }
      const sub = t.subs ? btn.nextElementSibling : null;
      const wasOpen = open === t.id;
      nav.querySelectorAll('.tab.open').forEach(x => x.classList.remove('open'));
      nav.querySelectorAll('.sub.open').forEach(x => x.classList.remove('open'));
      nav.querySelectorAll('.tab.active').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      if (!t.subs) { open = null; active = { tab: t.id, sub: null }; setCrumb(t.label, ''); return; }
      if (wasOpen) { open = null; return; }
      open = t.id;
      btn.classList.add('open');
      if (sub) sub.classList.add('open');
      if (active.tab !== t.id || !t.subs.includes(active.sub)) active = { tab: t.id, sub: t.subs[0] };
      nav.querySelectorAll('.subitem.on').forEach(x => x.classList.remove('on'));
      const first = sub && sub.querySelector('.subitem');
      if (first && active.sub === t.subs[0]) first.classList.add('on');
      else if (sub) { const match = [...sub.querySelectorAll('.subitem')].find(x => x.innerText.trim().endsWith(active.sub)); if (match) match.classList.add('on'); }
      setCrumb(t.label, active.sub);
    };
    nav.appendChild(btn);

    if (t.subs) {
      const sub = document.createElement('div');
      sub.className = 'sub' + (isOpen ? ' open' : '');
      const list = document.createElement('div');
      list.className = 'sublist';
      t.subs.forEach(s => {
        const b = document.createElement('button');
        b.className = 'subitem' + (active.tab === t.id && active.sub === s ? ' on' : '');
        b.innerHTML = '<span class="dot"></span>' + s;
        b.onclick = (e) => {
          e.stopPropagation();
          active = { tab: t.id, sub: s };
          nav.querySelectorAll('.subitem.on').forEach(x => x.classList.remove('on'));
          b.classList.add('on');
          setCrumb(t.label, s);
        };
        list.appendChild(b);
      });
      sub.appendChild(list);
      nav.appendChild(sub);
    }
  });
}
function setCrumb(tab, sub) {
  document.getElementById('ctitle').textContent = sub || tab;
  document.getElementById('crumb').innerHTML = 'dashboard / <b>' + tab + '</b>' + (sub ? ' / <b>' + sub + '</b>' : '');
  document.getElementById('cdesc').textContent = 'Section: "' + (sub || tab) + '" — sub-options sit right under their parent button so you can jump straight here.';
}
render();
setCrumb('customize', 'colors');
</script>
</body>
</html>
